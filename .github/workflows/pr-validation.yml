name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm ci

      - name: Check untrusted PR input handling
        run: python3 -B -m unittest discover -s scripts/tests -p test_pr_validation_security.py -v

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint

  check-ai-attribution:
    name: Check AI Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate metadata in every PR commit and touched path
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/project_metadata.py --changed --base "$BASE_SHA" --head "$HEAD_SHA"


  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm ci

      - name: Validate all PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose


  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch name
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          pattern='^(feature|fix|chore|docs|refactor|test|perf|revert)/[a-z0-9]+(-[a-z0-9]+)*(-[0-9]{8})?$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch name OK: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' violates rules/branch-naming.md"
            echo "Expected <type>/<kebab-case-slug>[-YYYYMMDD] with type in:"
            echo "  feature|fix|chore|docs|refactor|test|perf|revert"
            echo "Rename with: git branch -m '$BRANCH' 'feature/my-slug' && git push origin --delete '$BRANCH' && git push -u origin feature/my-slug"
            exit 1
          fi

  breaking-changes:
    name: Breaking Changes Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for breaking changes
        id: breaking
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          breaking_commits=""
          for commit in $(git rev-list ${BASE_SHA}..${HEAD_SHA}); do
            msg=$(git log -1 --format=%B "$commit")
            if echo "$msg" | grep -qiE "BREAKING[ -]CHANGE|^[a-z]+(\(.+\))?!:"; then
              short=$(git log -1 --format="%h %s" "$commit")
              breaking_commits="${breaking_commits}\n- ${short}"
            fi
          done

          if [ -n "$breaking_commits" ]; then
            echo "has_breaking=true" >> "$GITHUB_OUTPUT"
            echo "commits<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$breaking_commits" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "has_breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on breaking changes
        if: steps.breaking.outputs.has_breaking == 'true'
        uses: actions/github-script@v7
        env:
          BREAKING_COMMITS: ${{ steps.breaking.outputs.commits }}
        with:
          script: |
            const commits = process.env.BREAKING_COMMITS;
            const body = `## ⚠️ Breaking Changes Detected

            The following commits contain breaking changes:

            ${commits}

            Please ensure:
            - [ ] Migration guide is included
            - [ ] CHANGELOG is updated
            - [ ] Major version bump is planned
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

  size-label:
    name: PR Size Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read review budget from target branch
        id: review_budget
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$PR_BASE_SHA:.env.ci" 2>/dev/null; then
            budget="$(git show "$PR_BASE_SHA:.env.ci" | sed -n 's/^FLOWSTATE_PR_MAX_LINES=//p')"
          else
            budget=500
          fi
          if ! [[ "$budget" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::Invalid review budget in target .env.ci"
            exit 1
          fi
          echo "limit=$budget" >> "$GITHUB_OUTPUT"
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/XS"
          xs_max_size: 10
          s_label: "size/S"
          s_max_size: 50
          m_label: "size/M"
          m_max_size: 200
          l_label: "size/L"
          l_max_size: ${{ steps.review_budget.outputs.limit }}
          xl_label: "size/XL"
          fail_if_xl: true
          message_if_xl: >
            This PR exceeds the review budget. Split it into bounded PRs.
