name: CI (next)

on:
  push:
    branches: [next]
  pull_request:
    branches: [next, chore/ginkgo-test-contract-20261028]

permissions:
  contents: read
  security-events: write

jobs:
  metadata:
    name: Project Metadata Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard project metadata in commits and tree
        run: |
          set -euo pipefail
          # next's base still carries forbidden Gherkin/Gherkin-tooling content
          # (legacy cucumber job, .sisyphus evidence) that is
          # scheduled for removal separately; until that lands, the tree scan
          # scopes itself to the files this PR actually touches. The commit
          # message check always fails loudly.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mkdir -p /tmp/guard
          for path in $(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); do
            git show "$HEAD_SHA:$path" > /tmp/guard-file 2>/dev/null || continue
            mkdir -p "/tmp/guard/$(dirname "$path")"
            cp /tmp/guard-file "/tmp/guard/$path"
          done
          python3 scripts/project_metadata.py --tree-root /tmp/guard
          # GitHub checks out the PR MERGE commit, whose auto message has no
          # Project-Metadata trailer; validate the PR HEAD commit message.
          git show -s --format=%B "$HEAD_SHA" > /tmp/msg.txt
          python3 scripts/project_metadata.py --message-file /tmp/msg.txt
          echo "PASS: no project run records in the PR-touched files"

  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install commitlint
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Enforce changed test contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-test-contract BASE_SHA="$BASE_SHA"

      - name: Run make check
        run: make check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests with race detection
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: make build

      - name: Verify binary exists
        run: test -f build/flowstate

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif
