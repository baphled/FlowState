name: CI (next)

on:
  push:
    branches: [next]
  pull_request:
    branches: [next, chore/ginkgo-test-contract-20261028, chore/ginkgo-test-enforcement-20261028, chore/code-modularity-20261028, chore/documentation-tools-20261028, fix/metadata-contract-20261029]

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  scope:
    name: PR Review Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test review budget boundaries and bypass controls
        run: python3 -B -m unittest discover -s scripts/tests -p test_pr_size.py -v

      - name: Install pinned admission cryptography dependency
        run: python3 -m pip install -r scripts/requirements-admission.txt

      - name: Test merge admission and negative controls
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_admission_*.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_review_*.py' -v
          python3 -B -m unittest scripts.tests.test_app_credentials scripts.tests.test_status_issuer -v

      - name: Enforce base policy on the entire committed diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull requests diff against the PR base. Push events diff against the
          # first parent so force-pushes (github.event.before may no longer
          # exist) still resolve to a valid base commit.
          if [ -n "$PR_BASE_SHA" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          checker="$RUNNER_TEMP/pr_size_base.py"
          if git cat-file -e "$BASE_SHA:scripts/pr_size.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/pr_size.py" > "$checker"
          else
            cp scripts/pr_size.py "$checker"
          fi
          # Read the budget only from the trusted target, never the candidate PR.
          # Bootstrap before .env.ci exists on next with the original 500-line cap.
          if git cat-file -e "$BASE_SHA:.env.ci" 2>/dev/null; then
            budget="$(git show "$BASE_SHA:.env.ci" | sed -n 's/^FLOWSTATE_PR_MAX_LINES=//p')"
          else
            budget=500
          fi
          if ! [[ "$budget" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::Invalid FLOWSTATE_PR_MAX_LINES in target .env.ci"
            exit 1
          fi
          export FLOWSTATE_PR_MAX_LINES="$budget"
          python3 -B "$checker" --base "$BASE_SHA" --head "$HEAD_SHA"

  metadata:
    name: Project Metadata Guard
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test metadata contract and commit helper
        run: python3 -B -m unittest discover -s scripts/tests -p test_project_metadata.py -v

      - name: Guard every new commit and changed blob
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # See scope job: push events (including force-pushes) use the first
          # parent as base because github.event.before may be unreachable.
          BASE_SHA="${PR_BASE_SHA:-$(git rev-parse HEAD^)}"
          python3 -B scripts/project_metadata.py --changed --base "$BASE_SHA" --head "$HEAD_SHA"

  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm ci

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="$(git rev-parse HEAD^)"
          npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  pr-policy:
    name: PR Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch naming
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          pattern='^(feature|fix|chore|docs|refactor|test|perf|revert)/[a-z0-9]+(-[a-z0-9]+)*(-[0-9]{8})?$'
          if ! [[ "$BRANCH" =~ $pattern ]]; then
            echo "::error::Source branch violates rules/branch-naming.md"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "22"

      - name: Install PR title validator
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint

      - name: Push event has no PR title or source branch
        if: github.event_name == 'push'
        run: echo "PR-only policy is not applicable to a direct next push"

  lint:
    name: Lint & Format
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Enforce changed test contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-test-contract BASE_SHA="$BASE_SHA"

      - name: Enforce changed production structure
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-code-contract BASE_SHA="$BASE_SHA"

      - name: Test Python source contract regressions
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*python_contract*.py' -v

      - name: Enforce protected-base Python source contract
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$(git rev-parse HEAD^)}"
          guard_root="$RUNNER_TEMP/python-contract-guard"
          mkdir -p "$guard_root/scripts"
          : > "$guard_root/scripts/__init__.py"

          trusted=true
          for source in scripts/check_python_contract.py scripts/python_contract_ast.py scripts/contract_sources.py; do
            if ! git cat-file -e "$BASE_SHA:$source" 2>/dev/null; then
              trusted=false
              break
            fi
          done

          for source in scripts/check_python_contract.py scripts/python_contract_ast.py scripts/contract_sources.py; do
            if [ "$trusted" = true ]; then
              git show "$BASE_SHA:$source" > "$guard_root/$source"
            else
              cp "$source" "$guard_root/$source"
            fi
          done

          if [ "$trusted" != true ]; then
            echo "::notice::Bootstrapping Python contract; protected base has no checker yet"
          fi

          PYTHONPATH="$guard_root" python3 -B "$guard_root/scripts/check_python_contract.py" --base "$BASE_SHA"

      - name: Set up documentation tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned documentation dependencies
        run: npm ci

      - name: Enforce documentation contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-documentation BASE_SHA="$BASE_SHA"

      - name: Run make check
        run: make check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3

      - name: Enforce modularity and API documentation
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3
          args: --config .golangci-contract.yml --new-from-rev=${{ github.event.pull_request.base.sha }} --whole-files

  test:
    name: Test (${{ matrix.os }})
    needs: [scope]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run Go tests with race detection
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [lint, test, metadata, security, scope, commitlint, pr-policy]
    steps:
      - name: Require successful prerequisites
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ["NEEDS_JSON"])
          failures = {job: data.get("result") for job, data in results.items()
                      if data.get("result") != "success"}
          if not results or failures:
              print("Build blocked by unsuccessful prerequisites:", failures)
              sys.exit(1)
          PYTHON

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test required Build failure handling
        run: python3 -B -m unittest discover -s scripts/tests -p test_required_build.py -v

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: make build

      - name: Verify binary exists
        run: test -f build/flowstate

  security:
    name: Security Scan
    needs: [scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install gosec (pinned)
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0

      - name: Run govulncheck (pinned)
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: Test security regression gate
        run: python3 -B -m unittest discover -s scripts/tests -p test_security_gate.py -v

      # Compare full scans; inherited findings remain visible unresolved debt.
      - name: Reject new gosec findings
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # See scope job: push events (including force-pushes) use the first
          # parent as base because github.event.before may be unreachable.
          SECURITY_BASE_SHA="${PR_BASE_SHA:-$(git rev-parse HEAD^)}"
          python3 -B scripts/security_gate.py --base "$SECURITY_BASE_SHA" --output "$RUNNER_TEMP/security-results"

      - name: Retain full base and candidate scanner reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: ${{ runner.temp }}/security-results

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/security-results/candidate.sarif

  # Interim in-repo producer for the "flowstate/merge-admission" required
  # status context. The long-term design (#241) is an external trusted status
  # publisher (status issuer App + pinned runner); this job only provides a
  # fail-closed placeholder verdict until that is provisioned.
  merge-admission:
    name: flowstate/merge-admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Fail closed on any checkout/HEAD mismatch: never validate untrusted refs.
      - name: Verify exact head
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${PR_HEAD_SHA:-$EXPECTED_SHA}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Checked-out HEAD $actual does not match expected $expected"
            exit 1
          fi

      - name: Install pinned admission cryptography dependency
        run: python3 -m pip install -r scripts/requirements-admission.txt

      - name: Verify admission modules import cleanly
        run: |
          set -euo pipefail
          for module in scripts/admission_*.py; do
            name="$(basename "$module" .py)"
            python3 -c "import importlib; importlib.import_module('$name')"
          done

      - name: Run admission source tests
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_admission_*.py' -v

      - name: Interim admission verdict (privileged loop intentionally not run)
        run: |
          set -euo pipefail
          echo "Interim producer: admission source modules and tests pass on the exact head."
          echo "The privileged admission loop (scripts/admission_io.py main) fails closed by design"
          echo "and is not executed here. Authoritative admission remains with the external trusted"
          echo "publisher per #241 / issue #225."
