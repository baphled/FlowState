name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  pull_request:
    branches: [main, next]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/security.yml"
      - "scripts/tests/test_security_workflow.py"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test security workflow contract
        run: python3 -B -m unittest discover -s scripts/tests -p test_security_workflow.py -v

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
