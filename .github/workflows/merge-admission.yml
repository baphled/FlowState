# Must first be promoted through next -> main: privileged PR workflows are
# sourced from the repository DEFAULT branch (main), not the PR target (next).
# Do not check out or execute candidate PR code in this workflow.
name: FlowState Merge Admission

on:
  pull_request_target:
    branches: [next]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: merge-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Trusted admission
    if: github.event.pull_request.base.ref == 'next'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch verifier only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify external metadata and exact-head independent approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FLOWSTATE_DROPBOX_METADATA_READ_TOKEN: ${{ secrets.FLOWSTATE_DROPBOX_METADATA_READ_TOKEN }}
        run: python3 -B scripts/merge_admission.py
