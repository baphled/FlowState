# Must first be promoted through next -> main: privileged PR workflows are
# sourced from the repository DEFAULT branch (main), not the PR target (next).
# Do not check out or execute candidate PR code in this workflow.
name: FlowState Merge Admission
on:
  pull_request_target:
    branches: [next]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to revalidate after approval
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  statuses: read
concurrency:
  group: merge-admission-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: true
jobs:
  verify:
    name: Trusted admission
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'next') || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch verifier only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify external metadata and attested agent review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLOWSTATE_TRUSTED_STATUS_TOKEN: ${{ secrets.FLOWSTATE_TRUSTED_STATUS_TOKEN }}
          FLOWSTATE_AGENT_REVIEW_ATTESTATION_KEY: ${{ secrets.FLOWSTATE_AGENT_REVIEW_ATTESTATION_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FLOWSTATE_DROPBOX_METADATA_READ_TOKEN: ${{ secrets.FLOWSTATE_DROPBOX_METADATA_READ_TOKEN }}
        run: python3 -B scripts/merge_admission.py
