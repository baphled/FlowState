name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  GOSEC_VERSION: "v2.30.0"

jobs:
  scope:
    name: PR Review Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test review budget boundaries and bypass controls
        run: python3 -B -m unittest discover -s scripts/tests -p test_pr_size.py -v

      - name: Enforce base policy on the entire committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          checker="$RUNNER_TEMP/pr_size_base.py"
          if git cat-file -e "$BASE_SHA:scripts/pr_size.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/pr_size.py" > "$checker"
          else
            cp scripts/pr_size.py "$checker"
          fi
          # Read the budget only from the trusted target, never the candidate PR.
          # Bootstrap before .env.ci exists on next with the original 500-line cap.
          if git cat-file -e "$BASE_SHA:.env.ci" 2>/dev/null; then
            budget="$(git show "$BASE_SHA:.env.ci" | sed -n 's/^FLOWSTATE_PR_MAX_LINES=//p')"
          else
            budget=500
          fi
          if ! [[ "$budget" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::Invalid FLOWSTATE_PR_MAX_LINES in target .env.ci"
            exit 1
          fi
          export FLOWSTATE_PR_MAX_LINES="$budget"
          python3 -B "$checker" --base "$BASE_SHA" --head "$HEAD_SHA"

  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install commitlint
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint & Format
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Enforce changed test contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-test-contract BASE_SHA="$BASE_SHA"

      - name: Enforce changed production structure
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-code-contract BASE_SHA="$BASE_SHA"

      - name: Set up documentation tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned documentation dependencies
        run: npm ci

      - name: Enforce documentation contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-documentation BASE_SHA="$BASE_SHA"

      - name: Run make check
        run: make check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3

      - name: Enforce modularity and API documentation
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3
          args: --config .golangci-contract.yml --new-from-rev=${{ github.event.pull_request.base.sha }} --whole-files

  quality:
    name: Static Analysis (staticcheck + deadcode)
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run deadcode
        run: deadcode ./...

  test:
    name: Test (${{ matrix.os }})
    needs: [scope]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Race detector on linux only: highest signal, keeps cross-OS minutes sane
      - name: Run unit tests (race)
        if: matrix.os == 'ubuntu-latest'
        run: make test

      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: make test

  coverage:
    name: Coverage
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out > coverage-func.txt
          {
            echo "## Test Coverage"
            echo '```'
            cat coverage-func.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [lint, quality, test, security, scope]
    steps:
      - name: Require successful prerequisites
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ["NEEDS_JSON"])
          failures = {job: data.get("result") for job, data in results.items()
                      if data.get("result") != "success"}
          if not results or failures:
              print("Build blocked by unsuccessful prerequisites:", failures)
              sys.exit(1)
          PYTHON

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test required Build failure handling
        run: python3 -B -m unittest discover -s scripts/tests -p test_required_build.py -v

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Verify binary exists
        run: test -f build/flowstate

  security:
    name: Security Scan
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec (pinned)
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: Test security regression gate
        run: python3 -B -m unittest discover -s scripts/tests -p test_security_gate.py -v

      # Compare full scans; inherited findings remain visible unresolved debt.
      - name: Reject new gosec findings
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/security_gate.py --base "$SECURITY_BASE_SHA" --output "$RUNNER_TEMP/security-results"

      - name: Retain full base and candidate scanner reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: ${{ runner.temp }}/security-results

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/security-results/candidate.sarif
