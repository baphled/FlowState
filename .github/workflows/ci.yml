name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  GOSEC_VERSION: "v2.30.0"

jobs:
  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install commitlint
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Enforce changed test contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-test-contract BASE_SHA="$BASE_SHA"

      - name: Enforce changed production structure
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-code-contract BASE_SHA="$BASE_SHA"

      - name: Set up documentation tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned documentation dependencies
        run: npm ci

      - name: Enforce documentation contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-documentation BASE_SHA="$BASE_SHA"

      - name: Run make check
        run: make check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3

      - name: Enforce modularity and API documentation
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          args: --config .golangci-contract.yml --new-from-rev=${{ github.event.pull_request.base.sha }} --whole-files

  quality:
    name: Static Analysis (staticcheck + deadcode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run deadcode
        run: deadcode ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Race detector on linux only: highest signal, keeps cross-OS minutes sane
      - name: Run unit tests (race)
        if: matrix.os == 'ubuntu-latest'
        run: make test

      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: make test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out > coverage-func.txt
          {
            echo "## Test Coverage"
            echo '```'
            cat coverage-func.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [lint, quality, test, security]
    steps:
      - name: Require successful prerequisites
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ["NEEDS_JSON"])
          failures = {job: data.get("result") for job, data in results.items()
                      if data.get("result") != "success"}
          if not results or failures:
              print("Build blocked by unsuccessful prerequisites:", failures)
              sys.exit(1)
          PYTHON

      - uses: actions/checkout@v4

      - name: Test required Build failure handling
        run: python3 -B -m unittest discover -s scripts/tests -p test_required_build.py -v

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Verify binary exists
        run: test -f build/flowstate

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec (pinned)
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: Test security regression gate
        run: python3 -B -m unittest discover -s scripts/tests -p test_security_gate.py -v

      # Compare full scans; inherited findings remain visible unresolved debt.
      - name: Reject new gosec findings
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/security_gate.py --base "$SECURITY_BASE_SHA" --output "$RUNNER_TEMP/security-results"

      - name: Retain full base and candidate scanner reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: ${{ runner.temp }}/security-results

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/security-results/candidate.sarif
