version: "2"
# Standalone config for the funlen ratchet check
# (scripts/check-funlen-ratchet.sh). Deliberately excludes ALL exclusions
# so the ratchet counts every real funlen violation, including the debt
# files excluded in .golangci.yml. Never add exclusions here.
run:
  tests: true
linters:
  default: none
  enable:
    - funlen
  settings:
    funlen:
      lines: 50
      statements: 40
      ignore-comments: true
