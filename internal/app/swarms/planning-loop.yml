schema_version: "1.0.0"
id: planning-loop
description: >
  Reproduces today's deterministic planning loop: planner orchestrates
  explorer + librarian + analyst + plan-writer + plan-reviewer through
  the coordination_store. Lead is `planner`. Each member that writes
  structured output to the coord-store has a post-member gate
  validating that output against a registered JSON schema before the
  next member runs — malformed payloads halt the swarm with a
  GateError instead of cascading into downstream confusion.

# `planner` is a registered agent today (internal/app/agents/planner.md).
# It already orchestrates the five members listed below via its
# delegation.allowlist. The swarm runner inherits that wiring without
# changing the planner's prompt.
lead: planner

# Auto-dispatch this swarm when the user invokes `@planner` by name.
# Without this, `@planner` resolves to KindAgent and the planning loop
# never enters swarm mode — the planner runs solo. See internal/
# swarm/registry.go::AutoDispatchSwarmFor.
auto_dispatch_on_lead: true

# Explicit roster. `plan-sme-swarm` is a SUB-SWARM member (a member
# that resolves to another swarm) — sub-swarm composition ships today
# (resolveSubSwarm → DispatchSwarmMembers, internal/engine/delegation.go;
# live spec sub_swarm_recursion_test.go). It sits BETWEEN analyst and
# plan-writer so its section specialists each write a gated
# `{chainID}/sections/<name>` output (architecture / testing / security)
# AFTER the analyst's synthesis but BEFORE the plan-writer composes the
# lightweight OMO spine. The deterministic publisher (Pass 2) fans those
# section keys in at publish; the section gates live INSIDE
# plan-sme-swarm, so this parent needs no gate-aggregate change. See
# internal/app/swarms/plan-sme-swarm.yml and [[ADR - Engine-Owned
# Workflow Mechanics]] § "Application — Section-Decomposed Planning via
# SME Sub-Swarm".
members:
  - explorer
  - librarian
  - analyst
  - plan-sme-swarm
  - plan-writer
  - plan-reviewer

harness:
  # Sequential by default — the planner's loop is dependency-driven
  # (interview → research → analysis → write → review) and parallelism
  # at this layer would race the coordination_store. §T37 will offer
  # `parallel: true` for swarms whose member set is genuinely
  # independent.
  parallel: false

  # Defence-in-depth ceiling on a single member's whole stream (all its
  # internal failover attempts). The PRIMARY recoverability fix is the
  # per-provider stream guard (Transport.ResponseHeaderTimeout = 60s) which
  # makes failover advance past a flapping provider in ~60s; this caps a
  # member that wedges for a NON-network reason (runaway model, gate-retry
  # loop) so a run terminates instead of hanging indefinitely. 20m clears
  # legitimate long members (an explorer pass has been observed at ~14m)
  # while bounding a wedge. Zero/unset = the historical no-deadline contract.
  member_timeout: 20m

  # Swarm-level post-member gates, one per member that writes
  # structured output to the coord-store. Each gate names the
  # corresponding JSON schema registered in
  # internal/swarm/schemas.go::SeedDefaultSchemas. `kind:
  # builtin:result-schema` resolves in-process; no Extension API v1
  # backend required.
  # `output_key` carries the `{chainID}` template so the result-schema
  # gate resolves the SAME coord-store key the member actually wrote to:
  # the lead allocates a per-request chainID (e.g.
  # `plan-auth-2026-04-23`) and members write to
  # `<chainID>/<semantic-suffix>` (see internal/swarm/schemas.go and
  # internal/app/agents/*.md). The gate substitutes the lead's chainID
  # at runtime (internal/swarm/gate_result_schema.go::candidateKeys).
  # Before this fix the gate resolved the static
  # `planning/<target>/output` shape, which no member ever wrote to —
  # so every post-member gate failed with "no member output found" and
  # the lead retried delegation indefinitely.
  gates:
    - name: post-member-explorer-evidence-bundle
      kind: builtin:result-schema
      schema_ref: evidence-bundle-v1
      when: post-member
      target: explorer
      output_key: "{chainID}/codebase-findings"
    - name: post-member-librarian-external-refs
      kind: builtin:result-schema
      schema_ref: external-refs-v1
      when: post-member
      target: librarian
      output_key: "{chainID}/external-refs"
    - name: post-member-analyst-analysis-bundle
      kind: builtin:result-schema
      schema_ref: analysis-bundle-v1
      when: post-member
      target: analyst
      output_key: "{chainID}/analysis"
    - name: post-member-plan-writer-plan-document
      kind: builtin:result-schema
      schema_ref: plan-document-v1
      when: post-member
      target: plan-writer
      output_key: "{chainID}/plan"
    - name: post-member-plan-reviewer-result-schema
      kind: builtin:result-schema
      schema_ref: review-verdict-v1
      when: post-member
      target: plan-reviewer
      output_key: "{chainID}/review"
    # Honesty gate (Defect 4 + "no plan in Obsidian"): fires ONCE at swarm
    # end. Before this gate runs, the engine's FlushSwarmLifecycle calls a
    # DETERMINISTIC publisher (swarm.PublishPlanToVault) that writes the
    # `{chainID}/plan` body to a real file under plan_output_dir and
    # records the true path in `{chainID}/plan_publication` — no LLM in
    # the persistence path, so Defect 2's synthesis-hang cannot stop the
    # plan reaching Obsidian. This gate then UNCONDITIONALLY requires:
    #   (1) the `{chainID}/plan` coord-store key is non-empty,
    #   (2) a `{chainID}/plan_publication` record EXISTS (a missing record
    #       means the plan never reached the vault — fail), and
    #   (3) the claimed vault_path is under plan_output_dir AND the file
    #       actually exists at that path.
    # The publication record used to be OPTIONAL — an approved plan sitting
    # only in the coord-store passed the gate while nothing wrote it to the
    # vault. That was the user's bug; it is now a gate failure. Post-swarm
    # dispatch does not thread the lead's free-form chainID, so both the
    # publisher and the runner resolve the plan key by suffix-scan (parity
    # with the result-schema bootstrap path), keeping the keys consistent.
    # See internal/swarm/gate_artifact_published.go and
    # internal/swarm/publish.go.
    - name: post-swarm-plan-published
      kind: builtin:artifact-published
      when: post
      output_key: "{chainID}/plan"

context:
  # Coordination_store namespace for this swarm's runs. Defaults to the
  # swarm id when omitted; pinning explicitly so the documented chain
  # keys (e.g. `planning/<chain-id>/requirements`) are stable.
  chain_prefix: planning
