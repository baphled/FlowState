# planning-loop — deterministic, gate-enforced planning swarm
# =============================================================================
# This is the reference copy of the planning-loop swarm that ships embedded in
# the FlowState binary (internal/app/swarms/planning-loop.yml). Copy it into
# your personal swarm directory to study or customise the pattern:
#
#     cp examples/swarms/planning-loop.yml ~/.config/flowstate/swarms/
#     flowstate swarm validate planning-loop
#
# The binary already seeds an up-to-date copy into ~/.config/flowstate/swarms/
# on first run, so you only need to copy this file if you have deleted the
# seeded one or want to fork it under a new id.
#
# WHAT IT DOES
# ------------
# Reproduces the deterministic planning loop: the `planner` lead orchestrates
# explorer + librarian + analyst + plan-writer + plan-reviewer through the
# shared coordination_store. Each member that writes structured output to the
# coord-store has a post-member gate validating that output against a
# registered JSON schema BEFORE the next member runs — a malformed payload
# halts the swarm with a GateError instead of cascading into downstream
# confusion. A final post-swarm gate verifies the approved plan actually
# reached the vault before the loop is allowed to complete.
# =============================================================================

schema_version: "1.0.0"
id: planning-loop
description: >
  Reproduces today's deterministic planning loop: planner orchestrates
  explorer + librarian + analyst + plan-writer + plan-reviewer through
  the coordination_store. Lead is `planner`. Each member that writes
  structured output to the coord-store has a post-member gate
  validating that output against a registered JSON schema before the
  next member runs — malformed payloads halt the swarm with a
  GateError instead of cascading into downstream confusion.

# `planner` is a built-in agent (internal/app/agents/planner.md). It already
# orchestrates the five members below via its delegation.allowlist, so the
# swarm runner inherits that wiring without changing the planner's prompt.
lead: planner

# Auto-dispatch this swarm when the user invokes `@planner` by name. Without
# this, `@planner` resolves to a plain agent and the planning loop never
# enters swarm mode — the planner runs solo. See
# internal/swarm/registry.go::AutoDispatchSwarmFor.
auto_dispatch_on_lead: true

# Explicit roster — agent ids only. The order matters: with a sequential
# harness (below) the runner dispatches members in this order, which is the
# dependency order of the planning loop (interview → research → analysis →
# write → review). Sub-swarm members (a member that resolves to another
# swarm) are supported but not used here.
members:
  - explorer
  - librarian
  - analyst
  - plan-writer
  - plan-reviewer

harness:
  # Sequential by default — the planning loop is dependency-driven and
  # parallelism at this layer would race the coordination_store (a later
  # member reading a key an earlier member has not written yet).
  parallel: false

  # Swarm-level gates. The first five are post-member result-schema gates,
  # one per member that writes structured output to the coord-store. Each
  # gate names the JSON schema registered in
  # internal/swarm/schemas.go::SeedDefaultSchemas. `kind:
  # builtin:result-schema` resolves in-process — no Extension API backend
  # required.
  #
  # KEY CONTRACT (this is the load-bearing detail). `output_key` carries the
  # `{chainID}` template so the result-schema gate resolves the SAME
  # coord-store key the member actually wrote to. The lead allocates a
  # per-request chainID (e.g. `plan-auth-2026-04-23`) and members write to
  # `<chainID>/<semantic-suffix>`; the gate substitutes the lead's chainID at
  # runtime (internal/swarm/gate_result_schema.go::candidateKeys).
  #
  # Use the `{chainID}/<suffix>` form below — NOT the legacy
  # `planning/<target>/output` shape. The old static shape pointed at a key
  # no member ever wrote to, so every post-member gate failed with "no member
  # output found" and the lead retried delegation indefinitely.
  gates:
    - name: post-member-explorer-evidence-bundle
      kind: builtin:result-schema
      schema_ref: evidence-bundle-v1
      when: post-member
      target: explorer
      output_key: "{chainID}/codebase-findings"
    - name: post-member-librarian-external-refs
      kind: builtin:result-schema
      schema_ref: external-refs-v1
      when: post-member
      target: librarian
      output_key: "{chainID}/external-refs"
    - name: post-member-analyst-analysis-bundle
      kind: builtin:result-schema
      schema_ref: analysis-bundle-v1
      when: post-member
      target: analyst
      output_key: "{chainID}/analysis"
    - name: post-member-plan-writer-plan-document
      kind: builtin:result-schema
      schema_ref: plan-document-v1
      when: post-member
      target: plan-writer
      output_key: "{chainID}/plan"
    - name: post-member-plan-reviewer-result-schema
      kind: builtin:result-schema
      schema_ref: review-verdict-v1
      when: post-member
      target: plan-reviewer
      output_key: "{chainID}/review"

    # Honesty gate — fires ONCE at swarm end (`when: post`). Before this gate
    # runs, the engine's FlushSwarmLifecycle calls a DETERMINISTIC publisher
    # (swarm.PublishPlanToVault) that writes the `{chainID}/plan` body to a
    # real file under plan_output_dir and records the true path in
    # `{chainID}/plan_publication` — no LLM in the persistence path, so a
    # synthesis hang cannot stop the plan reaching the vault. This gate then
    # UNCONDITIONALLY requires:
    #   (1) the `{chainID}/plan` coord-store key is non-empty,
    #   (2) a `{chainID}/plan_publication` record EXISTS (a missing record
    #       means the plan never reached the vault — fail), and
    #   (3) the claimed vault_path is under plan_output_dir AND the file
    #       actually exists at that path.
    #
    # The publication record used to be OPTIONAL — an approved plan sitting
    # only in the coord-store passed the gate while nothing wrote it to the
    # vault. That was a real bug; it is now a gate failure. Post-swarm
    # dispatch does not thread the lead's free-form chainID, so both the
    # publisher and the runner resolve the plan key by suffix-scan (parity
    # with the result-schema path), keeping the keys consistent. See
    # internal/swarm/gate_artifact_published.go and internal/swarm/publish.go.
    - name: post-swarm-plan-published
      kind: builtin:artifact-published
      when: post
      output_key: "{chainID}/plan"

context:
  # Coordination_store namespace for this swarm's runs. Defaults to the swarm
  # id when omitted; pinned explicitly here so the documented chain keys are
  # stable across runs.
  chain_prefix: planning
